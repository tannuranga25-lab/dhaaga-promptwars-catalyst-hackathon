envVarGroups:
  - name: dhaaga-cron
    envVars:
      - key: CRON_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false

services:
  - type: web
    name: dhaaga
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: FIRESTORE_PROJECT_ID
        sync: false
      - key: FIRESTORE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - fromGroup: dhaaga-cron
      - key: EMAIL_ACTION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
  - type: cron
    name: dhaaga-minute-tick
    runtime: node
    region: singapore
    plan: starter
    schedule: "* * * * *"
    buildCommand: npm ci
    startCommand: node scripts/cron-tick.mjs
    envVars:
      - fromGroup: dhaaga-cron
